let abaAtual = 'oficiais';
const area = document.getElementById("painels");
const total = document.getElementById("total");
const tituloSecao = document.getElementById("titulo-Secao");

function mostrar(lista){
area.innerHTML="";
total.textContent=lista.length;

lista.forEach(p=>{
let inicial=p.nome.charAt(0);
let card=document.createElement("div");
card.className="card";

if(abaAtual === 'oficiais'){
card.innerHTML=`
<div class="logo">
<img src="${p.logo}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
<span>${inicial}</span>
</div>
<h3>${p.nome}</h3>
<a href="${p.url}" target="_blank">Abrir Painel</a>
`;
} else {
card.innerHTML=`
<div class="logo">
<img src="${p.logo}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
<span>${inicial}</span>
</div>
<h3>${p.nome}</h3>
<a href="${p.url}" target="_blank" style="background-color: #28a745;">Gerar painel teste com 1 crédito</a>
`;
}

area.appendChild(card);
});
}

function mudarAba(tipo){
abaAtual = tipo;
let pesquisaEl = document.getElementById("pesquisa");
pesquisaEl.value = "";

document.getElementById('btn-oficiais').style.opacity = tipo === 'oficiais' ? '1' : '0.6';
document.getElementById('btn-testes').style.opacity = tipo === 'testes' ? '1' : '0.6';

if(tipo === 'oficiais'){
tituloSecao.textContent = "Painéis Disponíveis";
mostrar(paineisOficiais);
} else {
tituloSecao.textContent = "Painéis de Teste Disponíveis";
mostrar(paineisTestes);
}
}

// Inicializa na aba oficial
mostrar(paineisOficiais);

document.getElementById("pesquisa").addEventListener("input",function(){
let valor=this.value.toLowerCase();
let base = abaAtual === 'oficiais' ? paineisOficiais : paineisTestes;
mostrar(base.filter(p=>p.nome.toLowerCase().includes(valor)));
});
