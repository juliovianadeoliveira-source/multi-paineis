<script>

const paineis = [

{
nome:"TopZ TV",
logo:"https://topztv.sigma.vin/api/settings/logo/zKA7xQNM?v=c6409f64",
url:"https://topztv.sigma.vin/#/sign-in"
},

{
nome:"Prod TV",
logo:"https://prodtv.sigma.st/api/settings/logo/q9DozyGw?v=8774d36a",
url:"https://prodtv.sigma.st/#/sign-in"
}

];

const area=document.getElementById("painels");

const total=document.getElementById("total");


function mostrar(lista){

area.innerHTML="";

total.textContent=lista.length;


lista.forEach(p=>{

let inicial=p.nome.charAt(0);


let card=document.createElement("div");

card.className="card";


card.innerHTML=`

<div class="logo">

<img 
src="${p.logo}"
loading="lazy"
onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
>

<span>${inicial}</span>

</div>


<h3>${p.nome}</h3>


<a href="${p.url}" target="_blank">

Abrir Painel

</a>

`;

area.appendChild(card);


});


}


mostrar(paineis);


</script>
