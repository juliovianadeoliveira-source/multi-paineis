<!-- ABA / SEÇÃO: Clientes Final CS Satélite e CS Net -->
<div id="tab-cs-sat-net" class="cs-sat-net-container">
    <style>
        .cs-sat-net-container {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            max-width: 450px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #222;
        }
        .cs-sat-net-container h2 {
            text-align: center;
            color: #00ffcc;
            font-size: 1.4rem;
            margin-bottom: 5px;
        }
        .cs-sat-net-container p.subtitle {
            text-align: center;
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .cs-plan-item {
            background: #1e1e1e;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        .cs-plan-info h4 {
            margin: 0;
            font-size: 1rem;
            color: #fff;
        }
        .cs-plan-info span {
            font-size: 0.8rem;
            color: #00ffcc;
        }
        .cs-plan-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cs-plan-controls button {
            background: #333;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .cs-plan-controls button:hover {
            background: #00ffcc;
            color: #000;
        }
        .cs-plan-controls span {
            font-size: 1rem;
            font-weight: bold;
            width: 20px;
            text-align: center;
        }
        .cs-cart-summary {
            background: #181818;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #333;
            text-align: center;
        }
        .cs-total-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .cs-total-text strong {
            color: #00ffcc;
        }
        .cs-pix-box {
            margin: 15px 0;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            display: inline-block;
        }
        .cs-pix-box img {
            width: 160px;
            height: 160px;
            display: block;
            margin: 0 auto;
        }
        .cs-pix-info {
            font-size: 0.75rem;
            color: #555;
            margin-top: 5px;
            font-weight: bold;
        }
        .cs-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .cs-btn-pay {
            background: #ff9900;
            color: #000;
        }
        .cs-btn-pay:hover {
            background: #ffaa22;
        }
        .cs-btn-whatsapp {
            background: #25d366;
            color: #fff;
            display: none; /* Bloqueado inicialmente */
            text-decoration: none;
            text-align: center;
            line-height: normal;
        }
        .cs-btn-whatsapp:hover {
            background: #20ba5a;
        }
        .cs-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: cs-spin 0.8s linear infinite;
            margin: 10px auto;
        }
        @keyframes cs-spin {
            to { transform: rotate(360deg); }
        }
        .cs-success-msg {
            color: #00ffcc;
            font-size: 0.9rem;
            font-weight: bold;
            margin: 10px 0;
            display: none;
        }
    </style>

    <h2>CS Satélite & CS Net</h2>
    <p class="subtitle">Selecione seus serviços para montar o carrinho</p>

    <!-- Lista de Planos com Botões + e - -->
    <div class="cs-plan-item">
        <div class="cs-plan-info">
            <h4>CS Sat 1 Mês</h4>
            <span>R$ 15,00</span>
        </div>
        <div class="cs-plan-controls">
            <button onclick="csAlterarQtd('sat1', -1)">-</button>
            <span id="cs-qtd-sat1">0</span>
            <button onclick="csAlterarQtd('sat1', 1)">+</button>
        </div>
    </div>

    <div class="cs-plan-item">
        <div class="cs-plan-info">
            <h4>CS Sat 6 Meses</h4>
            <span>R$ 50,00</span>
        </div>
        <div class="cs-plan-controls">
            <button onclick="csAlterarQtd('sat6', -1)">-</button>
            <span id="cs-qtd-sat6">0</span>
            <button onclick="csAlterarQtd('sat6', 1)">+</button>
        </div>
    </div>

    <div class="cs-plan-item">
        <div class="cs-plan-info">
            <h4>CS Sat Anual</h4>
            <span>R$ 120,00</span>
        </div>
        <div class="cs-plan-controls">
            <button onclick="csAlterarQtd('satanual', -1)">-</button>
            <span id="cs-qtd-satanual">0</span>
            <button onclick="csAlterarQtd('satanual', 1)">+</button>
        </div>
    </div>

    <!-- Carrinho / Resumo e Pagamento -->
    <div class="cs-cart-summary">
        <div class="cs-total-text">Total a Pagar: <strong id="cs-valor-total">R$ 0,00</strong></div>

        <!-- QR Code Pix -->
        <div class="cs-pix-box">
            <!-- Imagem base64 do QR Code enviado -->
            <img id="cs-qrcode-img" src="" alt="QR Code Pix">
            <div class="cs-pix-info">Titular: Julio Viana de Oliveira<br>Caixa Econômica Federal</div>
        </div>

        <!-- Botão de simular pagamento -->
        <button id="cs-btn-simular" class="cs-btn cs-btn-pay" onclick="csProcessarPagamento()">Já Fiz o Pagamento</button>

        <!-- Animação de Carregamento -->
        <div id="cs-spinner" class="cs-spinner"></div>

        <!-- Mensagem de Sucesso -->
        <div id="cs-success-msg" class="cs-success-msg">Pagamento efetuado com sucesso!</div>

        <!-- Botão do WhatsApp (Liberado Somente Após o Pagamento) -->
        <a id="cs-btn-wpp" href="#" target="_blank" class="cs-btn cs-btn-whatsapp">Enviar Comprovante no WhatsApp</a>
    </div>

    <script>
        // Armazenamento das quantidades
        const csCarrinho = {
            sat1: { nome: 'CS Sat 1 Mês', preco: 15.00, qtd: 0 },
            sat6: { nome: 'CS Sat 6 Meses', preco: 50.00, qtd: 0 },
            satanual: { nome: 'CS Sat Anual', preco: 120.00, qtd: 0 }
        };

        // Inserir a imagem do QR Code de forma dinâmica segura
        document.getElementById('cs-qrcode-img').src = document.querySelector('img[name*="WhatsApp Image"]').src;

        function csAlterarQtd(item, delta) {
            if (csCarrinho[item].qtd + delta >= 0) {
                csCarrinho[item].qtd += delta;
                document.getElementById(`cs-qtd-${item}`).innerText = csCarrinho[item].qtd;
                csAtualizarTotal();
            }
        }

        function csAtualizarTotal() {
            let total = 0;
            for (let i in csCarrinho) {
                total += csCarrinho[i].preco * csCarrinho[i].qtd;
            }
            document.getElementById('cs-valor-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function csProcessarPagamento() {
            let total = 0;
            for (let i in csCarrinho) {
                total += csCarrinho[i].preco * csCarrinho[i].qtd;
            }

            if (total <= 0) {
                alert('Por favor, selecione pelo menos um serviço no carrinho antes de prosseguir.');
                return;
            }

            // Ocultar botão de pagamento e mostrar spinner
            document.getElementById('cs-btn-simular').style.display = 'none';
            document.getElementById('cs-spinner').style.display = 'block';

            setTimeout(() => {
                // Esconder spinner e mostrar sucesso
                document.getElementById('cs-spinner').style.display = 'none';
                document.getElementById('cs-success-msg').style.display = 'block';

                // Montar mensagem para o WhatsApp com os itens comprados
                let resumoItens = "";
                for (let i in csCarrinho) {
                    if (csCarrinho[i].qtd > 0) {
                        resumoItens += `* ${csCarrinho[i].qtd}x ${csCarrinho[i].nome}%0A`;
                    }
                }
                let totalStr = document.getElementById('cs-valor-total').innerText;
                let mensagemWpp = `Olá! Realizei o pagamento referente aos serviços:%0A${resumoItens}Total: ${totalStr}%0A*Titular Pix:* Julio Viana de Oliveira (Caixa)%0AAgueco o envio do comprovante em anexo.`;
                
                // Atribuir link do WhatsApp com o número padrão ou ajuste se necessário
                document.getElementById('cs-btn-wpp').href = `https://wa.me/?text=${mensagemWpp}`;
                document.getElementById('cs-btn-wpp').style.display = 'block';

            }, 2000); // 2 segundos de animação girando
        }
    </script>
</div>
