function mostrar(lista){

<h3>${p.nome}</h3>

`;

function mudarAba(tipo){
abaAtual = tipo;
let pesquisaEl = document.getElementById("pesquisa");
pesquisaEl.value = "";

document.getElementById('btn-oficiais').style.opacity = tipo === 'oficiais' ? '1' : '0.6';
document.getElementById('btn-testes').style.opacity = tipo === 'testes' ? '1' : '0.6';
document.getElementById('btn-parceiros').style.opacity = tipo === 'parceiros' ? '1' : '0.6';

if(tipo === 'oficiais'){
bannerParceiros.style.display = "none";
tituloSecao.textContent = "Painéis Disponíveis";
mostrar(paineisOficiais);
} else if(tipo === 'testes') {
bannerParceiros.style.display = "none";
tituloSecao.textContent = "Painéis de Teste Disponíveis";
mostrar(paineisTestes);
} else {
bannerParceiros.style.display = "block";
tituloSecao.textContent = "Apps Parceiros Disponíveis";
mostrar(appsParceiros);
}
}

// Inicializa na aba oficial
mostrar(paineisOficiais);

document.getElementById("pesquisa").addEventListener("input",function(){
let valor=this.value.toLowerCase();
let base;
if(abaAtual === 'oficiais') base = paineisOficiais;
else if(abaAtual === 'testes') base = paineisTestes;
else base = appsParceiros;

mostrar(base.filter(p=>p.nome.toLowerCase().includes(valor)));
});
